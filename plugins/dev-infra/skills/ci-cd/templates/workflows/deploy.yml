# Deploy Firebase (Functions, Firestore rules/indexes, App Hosting web) to one environment, then smoke-test it.
# - dev: automatically after CI succeeds on main
# - staging (protected): manual run from main only (GitHub Environment branch policy)
# Auth: Workload Identity Federation; each environment's service account can only be used by jobs in the
# GitHub Environment of the same name. Generated by the dev-infra plugin (ci-cd module).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging]   # = spec environment names
        required: true

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ vars.WEB_URL }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run: deploy exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # --force: functions removed from source are deleted (source is the truth) and the
      # Artifact Registry cleanup policy is set automatically on the first deploy.
      # Without web-nextjs: drop `apphosting` from --only (and the web smoke step below).
      - name: firebase deploy
        run: npx -y firebase-tools@15.33.0 deploy --only functions,firestore,apphosting -P "$TARGET_ENV" --non-interactive --force

      - name: Smoke — functions health
        run: |
          body=$(curl -sf "${{ vars.FUNCTIONS_URL }}/health")
          echo "$body"
          echo "$body" | grep -q "\"env\":\"$TARGET_ENV\""
      - name: Smoke — web E2E against the deployed URL
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          E2E_BASE_URL="${{ vars.WEB_URL }}" E2E_EXPECT_ENV="$TARGET_ENV" pnpm --filter web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ env.TARGET_ENV }}
          path: apps/web/playwright-report
          retention-days: 7
